description: Real-world PostHog endpoint benchmark

prompts:
  - "{{prompt}}"

providers:
  - id: http
    label: CLI string tool
    config:
      url: http://localhost:3322/api/benchmark/run
      method: POST
      headers:
        Content-Type: application/json
      body:
        approach: cli
        prompt: "{{prompt}}"
        stream: false
      transformResponse: |
        {
          output: json.output || "",
          tokenUsage: json.tokenUsage,
          metadata: {
            approach: json.approach,
            status: json.status,
            metrics: json.metrics,
            traces: json.traces
          }
        }

  - id: http
    label: Direct API tools
    config:
      url: http://localhost:3322/api/benchmark/run
      method: POST
      headers:
        Content-Type: application/json
      body:
        approach: api
        prompt: "{{prompt}}"
        stream: false
      transformResponse: |
        {
          output: json.output || "",
          tokenUsage: json.tokenUsage,
          metadata: {
            approach: json.approach,
            status: json.status,
            metrics: json.metrics,
            traces: json.traces
          }
        }

  - id: http
    label: MCP tools
    config:
      url: http://localhost:3322/api/benchmark/run
      method: POST
      headers:
        Content-Type: application/json
      body:
        approach: mcp
        prompt: "{{prompt}}"
        stream: false
      transformResponse: |
        {
          output: json.output || "",
          tokenUsage: json.tokenUsage,
          metadata: {
            approach: json.approach,
            status: json.status,
            metrics: json.metrics,
            traces: json.traces
          }
        }

# Ground truth lives in evals/ground_truth/*.md, regenerated from PostHog by
# `npm run truth` (scripts/generate-ground-truth.mjs), so every number below
# is auditable and reproducible.
defaultTest:
  options:
    runSerially: true
  assert:
    - type: llm-rubric
      value: >
        Grade the answer against this PostHog source of truth:

        {{source_truth}}

        Fail immediately if the source of truth contains the phrase "GROUND
        TRUTH PENDING" (the benchmark task is not ready to grade).

        Fail if the answer is a refusal, an apology, a tool-availability
        disclaimer, or otherwise does not attempt the task despite data
        being available in the source of truth.

        Otherwise, pass if the answer addresses the task and its important
        counts, rankings, event names, and URLs match the source truth.
        Allow concise wording differences and minor formatting differences.
        Fail if important numeric claims contradict the source truth.

tests:
  - description: Marketing top pages
    vars:
      prompt: >
        Using PostHog, identify the top pages or URLs by pageviews for
        April 6, 2026 through May 6, 2026. Return a ranked list with counts.
      source_truth: file://ground_truth/marketing-top-pages.md
    metadata:
      prompt_id: marketing-top-pages

  # Multi-step drill-down: the agent must first find the top blog URL, then
  # run a second breakdown query against it.
  - description: Blog device drilldown
    vars:
      prompt: >
        Using PostHog, find the single top marketing blog URL by pageviews for
        April 6, 2026 through May 6, 2026, then break down that URL's
        pageviews by device type. Return the URL and the device breakdown
        with counts.
      source_truth: file://ground_truth/blog-device-drilldown.md
    metadata:
      prompt_id: blog-device-drilldown

  # Larger output: a full inventory rather than a top-N, exercising how each
  # surface handles bigger result sets.
  - description: All pages inventory
    vars:
      prompt: >
        Using PostHog, list every distinct page path that received pageviews
        for April 6, 2026 through May 6, 2026, with pageview counts, ordered
        from most to least viewed.
      source_truth: file://ground_truth/all-pages-inventory.md
    metadata:
      prompt_id: all-pages-inventory

  # Event-name discovery: the prompt describes the product flows in plain
  # language; the agent must find the actual event names.
  - description: Product usage events
    vars:
      prompt: >
        Using PostHog, summarize the product usage events for the
        extract-to-sheet flows between June 15 and July 4, 2026 — extractions,
        sheet inserts, credit usage, sign-ins, and checkout activity. Return
        the actual event names with event counts and unique people.
      source_truth: file://ground_truth/product-usage-events.md
    metadata:
      prompt_id: product-usage-events

  # Anomaly spotting on a low-volume pipeline.
  - description: OAuth token pipeline
    vars:
      prompt: >
        Using PostHog, analyze the Google OAuth token pipeline for June 15
        through July 4, 2026: report the count of each google_oauth_tokens
        event and point out anything inconsistent between the counts.
      source_truth: file://ground_truth/oauth-token-pipeline.md
    metadata:
      prompt_id: oauth-token-pipeline

  # High-volume background job health check.
  - description: Trial credits batch health
    vars:
      prompt: >
        Using PostHog, check the health of the trial credits batch job for
        June 15 through July 4, 2026: how many batch runs started versus
        completed, how many days it was active, and how many trial credit
        grants actually happened.
      source_truth: file://ground_truth/trial-credits-batch-health.md
    metadata:
      prompt_id: trial-credits-batch-health

  # Data-warehouse discovery: the answer lives in Google Ads warehouse
  # tables, not events. Table names must be discovered.
  - description: Ads campaign overview
    vars:
      prompt: >
        Using the Google Ads data connected to PostHog (data warehouse),
        report each campaign's name, total clicks, impressions, spend in
        dollars, and CTR for June 1 through June 30, 2026.
      source_truth: file://ground_truth/ads-campaign-overview.md
    metadata:
      prompt_id: ads-campaign-overview

  # Cross-source comparison: warehouse table joined conceptually with
  # product analytics events, bucketed by week.
  - description: Ads clicks vs pageviews weekly
    vars:
      prompt: >
        Using PostHog, compare weekly Google Ads clicks (from the connected
        ads data warehouse) against weekly website pageviews for June 1
        through June 30, 2026, weeks starting Monday. Return both weekly
        series with counts.
      source_truth: file://ground_truth/ads-clicks-vs-pageviews-weekly.md
    metadata:
      prompt_id: ads-clicks-vs-pageviews-weekly
