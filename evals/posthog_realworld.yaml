description: Real-world PostHog endpoint benchmark

prompts:
  - "{{prompt}}"

providers:
  - id: http
    label: CLI string tool
    config:
      url: http://localhost:3322/api/benchmark/run
      method: POST
      headers:
        Content-Type: application/json
      body:
        approach: cli
        prompt: "{{prompt}}"
        stream: false
      transformResponse: |
        {
          output: json.output || "",
          tokenUsage: json.tokenUsage,
          metadata: {
            approach: json.approach,
            status: json.status,
            metrics: json.metrics,
            traces: json.traces
          }
        }

  - id: http
    label: Direct API tools
    config:
      url: http://localhost:3322/api/benchmark/run
      method: POST
      headers:
        Content-Type: application/json
      body:
        approach: api
        prompt: "{{prompt}}"
        stream: false
      transformResponse: |
        {
          output: json.output || "",
          tokenUsage: json.tokenUsage,
          metadata: {
            approach: json.approach,
            status: json.status,
            metrics: json.metrics,
            traces: json.traces
          }
        }

  - id: http
    label: MCP tools
    config:
      url: http://localhost:3322/api/benchmark/run
      method: POST
      headers:
        Content-Type: application/json
      body:
        approach: mcp
        prompt: "{{prompt}}"
        stream: false
      transformResponse: |
        {
          output: json.output || "",
          tokenUsage: json.tokenUsage,
          metadata: {
            approach: json.approach,
            status: json.status,
            metrics: json.metrics,
            traces: json.traces
          }
        }

# Ground truth lives in evals/ground_truth/*.md, regenerated from PostHog by
# `npm run truth` (scripts/generate-ground-truth.mjs), so every number below
# is auditable and reproducible.
defaultTest:
  options:
    runSerially: true
  assert:
    - type: llm-rubric
      value: >
        Grade the answer against this PostHog source of truth:

        {{source_truth}}

        Fail immediately if the source of truth contains the phrase "GROUND
        TRUTH PENDING" (the benchmark task is not ready to grade).

        Fail if the answer is a refusal, an apology, a tool-availability
        disclaimer, or otherwise does not attempt the task despite data
        being available in the source of truth.

        Otherwise, pass if the answer addresses the task and its important
        counts, rankings, event names, and URLs match the source truth.
        Allow concise wording differences and minor formatting differences.
        Fail if important numeric claims contradict the source truth.

tests:
  - description: Marketing blog top pages
    vars:
      prompt: >
        Using PostHog, find the top-performing marketing blog URLs by pageviews
        for April 6, 2026 through May 6, 2026. Return the ranked URLs,
        pageview counts, and the event/property used.
      source_truth: file://ground_truth/marketing-blog-top-pages.md
    metadata:
      prompt_id: marketing-blog-top-pages

  - description: Marketing top pages
    vars:
      prompt: >
        Using PostHog, identify the top pages or URLs by pageviews for
        April 6, 2026 through May 6, 2026. Return a ranked list with counts.
      source_truth: file://ground_truth/marketing-top-pages.md
    metadata:
      prompt_id: marketing-top-pages

  - description: App custom events
    vars:
      prompt: >
        Using PostHog, find the top app-specific or custom events for
        April 6, 2026 through May 6, 2026, excluding generic pageview and
        autocapture-style events. Include event names and counts.
      source_truth: file://ground_truth/app-custom-events.md
    metadata:
      prompt_id: app-custom-events

  - description: Activation event count
    vars:
      prompt: >
        Using PostHog, summarize signup, activation, and agent/workflow events
        for April 6, 2026 through May 6, 2026. Return event counts and unique
        people where available.
      source_truth: file://ground_truth/activation-event-count.md
    metadata:
      prompt_id: activation-event-count

  # Multi-step drill-down: the agent must first find the top blog URL, then
  # run a second breakdown query against it.
  - description: Blog device drilldown
    vars:
      prompt: >
        Using PostHog, find the single top marketing blog URL by pageviews for
        April 6, 2026 through May 6, 2026, then break down that URL's
        pageviews by device type. Return the URL and the device breakdown
        with counts.
      source_truth: file://ground_truth/blog-device-drilldown.md
    metadata:
      prompt_id: blog-device-drilldown

  # Time bucketing: forces date math instead of a single top-N aggregation.
  - description: Weekly pageview trend
    vars:
      prompt: >
        Using PostHog, report weekly $pageview totals for April 6, 2026
        through May 6, 2026 (weeks starting Monday), and say whether the
        trend over those weeks is up, down, or flat.
      source_truth: file://ground_truth/weekly-pageview-trend.md
    metadata:
      prompt_id: weekly-pageview-trend

  # Larger output: a full inventory rather than a top-N, exercising how each
  # surface handles bigger result sets.
  - description: All pages inventory
    vars:
      prompt: >
        Using PostHog, list every distinct page path that received pageviews
        for April 6, 2026 through May 6, 2026, with pageview counts, ordered
        from most to least viewed.
      source_truth: file://ground_truth/all-pages-inventory.md
    metadata:
      prompt_id: all-pages-inventory
